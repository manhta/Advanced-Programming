<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/layout :: head('Thay đổi mật khẩu')}"></head>
    <body>
        <header th:replace="~{fragments/layout :: header}"></header>
        <main>
            <nav th:replace="~{fragments/layout :: breadcrumb('Thay đổi mật khẩu')}"></nav>
            <h1>Thay đổi mật khẩu</h1>
            <p>Nhập mật khẩu hiện tại và mật khẩu mới dài 12–128 ký tự.</p>
            <p class="success" th:if="${successMessage}" th:text="${successMessage}" role="status"></p>
            <p class="error" th:if="${errorMessage}" th:text="${errorMessage}" role="alert"></p>
            <form class="card personal-password" th:action="@{/account/password}" method="post">
                <label>Mật khẩu hiện tại
                    <input type="password" name="currentPassword" maxlength="128" autocomplete="current-password" required>
                </label>
                <label>Mật khẩu mới
                    <input type="password" name="newPassword" minlength="12" maxlength="128" autocomplete="new-password" required>
                </label>
                <label>Xác nhận mật khẩu mới
                    <input type="password" name="confirmPassword" minlength="12" maxlength="128" autocomplete="new-password" required>
                </label>
                <button type="submit">Lưu mật khẩu mới</button>
            </form>
        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </body>
</html>
