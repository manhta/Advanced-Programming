<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/layout :: head('Mật khẩu cấp 2')}"></head>
    <body>
        <header th:replace="~{fragments/layout :: header}"></header>
        <main>
            <nav th:replace="~{fragments/layout :: breadcrumb('Mật khẩu cấp 2')}"></nav>
            <h1>Thiết lập mật khẩu cấp 2</h1>
            <p>Mật khẩu riêng để ghi quyết định phê duyệt/từ chối yêu cầu đọc. Nhập lại ở mỗi lần quyết định; không lưu vào nhật ký hoặc trình duyệt.</p>
            <p th:if="${successMessage}" th:text="${successMessage}" role="status"></p>
            <p th:if="${errorMessage}" th:text="${errorMessage}" role="alert"></p>
            <form th:action="@{/director/approval-secret}" method="post">
                <label>Mật khẩu đăng nhập hiện tại<input
                        name="currentPassword"
                        type="password"
                        required
                        autocomplete="current-password"
                    ></label>
                <label>Mật khẩu cấp 2 mới (12–128 ký tự, khác mật khẩu đăng nhập)<input
                        name="secret"
                        type="password"
                        minlength="12"
                        maxlength="128"
                        required
                        autocomplete="new-password"
                    ></label>
                <button>Lưu mật khẩu cấp 2</button>
            </form>
        </main>
    </body>
</html>
